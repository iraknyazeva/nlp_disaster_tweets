seed: 42

tfidf:
  ngram_range: [1,2]
  max_features: 30000
  min_df: 2

logreg:
  class_weight: "balanced"
  max_iter: 2000
  param_grid:
    C: [0.01, 0.1, 1, 10]
    penalty: ["l1", "l2"]
    solver: ["liblinear"]

catboost:
  n_trials: 12
  early_stopping_rounds: 50
  search_space:
    iterations:
      type: int
      low: 300
      high: 800
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    depth:
      type: int
      low: 4
      high: 8
    l2_leaf_reg:
      type: float
      low: 0.001
      high: 10.0
      log: true

cv_folds: 5
scoring: "f1"